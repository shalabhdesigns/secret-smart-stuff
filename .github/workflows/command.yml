# Lets Claude (or the owner) drive the pipeline by committing a small request file,
# instead of clicking in GitHub. Push commands/request.json with:
#   {"action": "produce", "topic": "", "nonce": "..."}
#   {"action": "approve" | "reject" | "fix", "job": "<job id>", "note": "...", "nonce": "..."}
name: command
on:
  push:
    branches: [main]
    paths: ["commands/request.json"]
concurrency: { group: shorts-state, cancel-in-progress: false, queue: max }
permissions: { contents: write, issues: write }
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SHORTS_MODE: ${{ vars.SHORTS_MODE || 'dry_run' }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
      BFL_API_KEY: ${{ secrets.BFL_API_KEY }}
      YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
      YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
      YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v6
        with: { python-version: "3.12", cache: pip }
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null
      - run: pip install -q -r requirements.txt
      - run: scripts/state_sync.sh pull
      - name: Run the requested command
        run: python scripts/run_command.py commands/request.json
      - name: Save state
        if: always()
        run: scripts/state_sync.sh push
