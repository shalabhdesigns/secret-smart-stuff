# Every 6 hours: pull YouTube Analytics for uploaded Shorts and update insights.
name: analytics
on:
  schedule:
    - cron: "41 */6 * * *"
  workflow_dispatch:
concurrency: { group: shorts-state, cancel-in-progress: false, queue: max }
permissions: { contents: write }
jobs:
  analytics:
    if: vars.SHORTS_MODE == 'live'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
      YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
      YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -q -r requirements.txt
      - run: scripts/state_sync.sh pull
      - run: python -m shorts.cli analytics
      - if: always()
        run: scripts/state_sync.sh push
