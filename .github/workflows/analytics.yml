# Every 4 h, plus shortly after each publish slot: verify uploads went live, pull YouTube
# Analytics, rebuild the dashboard.
name: analytics
on:
  schedule:
    # every 6 h (3 Nov 2026: was 4 h + 3 extra runs; GitHub Free has 2,000 Actions minutes a month for private repos,
    # and YouTube Analytics / Instagram insights lag 1-2 days anyway; live view counts come from the Data API)
    - cron: "41 */6 * * *"
  workflow_dispatch:
concurrency: { group: shorts-state, cancel-in-progress: false, queue: max }
permissions: { contents: write, issues: write, actions: read }   # actions: run timings (minutes used)
jobs:
  analytics:
    if: vars.SHORTS_MODE == 'live'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      SHORTS_MODE: live
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
      BFL_API_KEY: ${{ secrets.BFL_API_KEY }}
      YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
      YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      GH_TOKEN: ${{ github.token }}          # Instagram catch-up posts download the video from its release
      ANTHROPIC_ADMIN_KEY: ${{ secrets.ANTHROPIC_ADMIN_KEY }}   # optional: billed Anthropic cost (organisations only)
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v6
        with: { python-version: "3.12", cache: pip }
      - run: pip install -q -r requirements.txt
      - run: scripts/state_sync.sh pull
      - run: |
          set -o pipefail
          python -m shorts.cli analytics 2>&1 | tee "$RUNNER_TEMP/out.log"
      - if: failure()
        env: { GH_TOKEN: "${{ github.token }}" }
        run: python scripts/post_failure_log.py "$RUNNER_TEMP/out.log" "Run ${{ github.run_id }} failed (analytics)"
      - if: always()
        run: scripts/state_sync.sh push
