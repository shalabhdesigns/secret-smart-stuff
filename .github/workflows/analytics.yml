# Every 4 h, plus shortly after each publish slot: verify uploads went live, pull YouTube
# Analytics, rebuild the dashboard.
name: analytics
on:
  schedule:
    - cron: "41 */4 * * *"
    - cron: "57 13 * * *"       # 27 min after the 13:30 UTC slot
    - cron: "27 17 * * *"       # after 17:00 UTC
    - cron: "27 2 * * *"        # after 02:00 UTC
  workflow_dispatch:
concurrency: { group: shorts-state, cancel-in-progress: false, queue: max }
permissions: { contents: write, issues: write }
jobs:
  analytics:
    if: vars.SHORTS_MODE == 'live'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      SHORTS_MODE: live
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
      BFL_API_KEY: ${{ secrets.BFL_API_KEY }}
      YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
      YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v6
        with: { python-version: "3.12", cache: pip }
      - run: pip install -q -r requirements.txt
      - run: scripts/state_sync.sh pull
      - run: |
          set -o pipefail
          python -m shorts.cli analytics 2>&1 | tee "$RUNNER_TEMP/out.log"
      - if: failure()
        env: { GH_TOKEN: "${{ github.token }}" }
        run: python scripts/post_failure_log.py "$RUNNER_TEMP/out.log" "Run ${{ github.run_id }} failed (analytics)"
      - if: always()
        run: scripts/state_sync.sh push
