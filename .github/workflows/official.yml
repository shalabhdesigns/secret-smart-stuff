# Download Rockstar's official GTA images onto a runner and keep them in the Actions cache (private).
# They are never committed: the repo is public. Contact sheets are uploaded so Claude can describe each image.
name: official-images
on:
  workflow_dispatch: {}
permissions: { contents: read }
jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.12", cache: pip }
      - run: pip install -q pillow
      - uses: actions/cache/restore@v4
        with:
          path: assets/official/img
          key: official-v1-${{ github.run_id }}
          restore-keys: official-v1-
      - run: python -m shorts.official sync "$RUNNER_TEMP/sheets"
      - uses: actions/cache/save@v4
        with:
          path: assets/official/img
          key: official-v1-${{ github.run_id }}
      - uses: actions/upload-artifact@v4
        with:
          name: official-sheets
          path: ${{ runner.temp }}/sheets
          retention-days: 7
