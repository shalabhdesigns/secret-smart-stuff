# Download Rockstar's official GTA images and video clips onto a runner and keep them in the Actions cache (private).
# They are never committed: the repo is public. Contact sheets go to a DRAFT release (drafts are private to the repo
# owner) so Claude can describe each image and shot.
name: official-images
on:
  workflow_dispatch: {}
  schedule:
    - cron: "23 3 * * *"     # daily (08:53 IST): pick up new official Rockstar videos and describe their shots
permissions: { contents: write }
jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      GH_TOKEN: ${{ github.token }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      SHORTS_MODE: live
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.12", cache: pip }
      - run: pip install -q -r requirements.txt && scripts/install_ffmpeg.sh
      - uses: actions/cache/restore@v4
        with:
          path: assets/official/img
          key: official-v1-${{ github.run_id }}
          restore-keys: official-v1-
      - uses: actions/cache/restore@v4
        with:
          path: assets/official/clips
          key: official-clips-v1-${{ github.run_id }}
          restore-keys: official-clips-v1-
      - run: python -m shorts.official sync "$RUNNER_TEMP/sheets"
      - run: python -m shorts.official_clips sync "$RUNNER_TEMP/shots"
      - uses: actions/cache/save@v4
        with:
          path: assets/official/img
          key: official-v1-${{ github.run_id }}
      - uses: actions/cache/save@v4
        with:
          path: assets/official/clips
          key: official-clips-v1-${{ github.run_id }}
      - name: Save the updated shot list to the repo (descriptions only; no footage is committed)
        run: |
          git config user.name "secret-smart-stuff bot"
          git config user.email "actions@users.noreply.github.com"
          git add assets/official/shots.json assets/official/shots_raw.json
          if ! git diff --cached --quiet; then
            git commit -m "Shot list: new official footage described (daily sync)"
            for i in 1 2 3; do git pull --rebase -q origin main && git push -q origin HEAD:main && break; sleep 5; done
          fi
      - name: Shot sheets to a private draft release
        run: |
          cp assets/official/shots_raw.json assets/official/shots.json "$RUNNER_TEMP/shots/"
          gh release delete official-shots --yes 2>/dev/null || true
          gh release create official-shots --draft --title "official shots (private draft)" \
            --notes "Contact sheets of Rockstar's official GTA VI clips, for describing shots. Draft: not public." \
            "$RUNNER_TEMP"/shots/*
