# Weekly learning report (Mondays) + the offline test suite.
name: weekly
on:
  schedule:
    - cron: "33 3 * * 1"        # Monday 09:03 IST
  workflow_dispatch:
concurrency: { group: shorts-state, cancel-in-progress: false, queue: max }
permissions: { contents: write }
jobs:
  learn:
    if: vars.SHORTS_MODE == 'live'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      SHORTS_MODE: live
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v6
        with: { python-version: "3.12", cache: pip }
      - run: pip install -q -r requirements.txt
      - run: scripts/state_sync.sh pull
      - run: python -m shorts.cli learn
      - if: always()
        run: scripts/state_sync.sh push
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.12", cache: pip }
      - run: scripts/install_ffmpeg.sh
        timeout-minutes: 15
      - run: pip install -q -r requirements.txt && python -m pytest -q
      - run: node worker/test.mjs
