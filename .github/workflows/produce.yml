# Daily production: make ONE Short and send it to the owner's Telegram for review.
name: produce
on:
  # Daily at 05:47 IST (00:17 UTC). Makes nothing while a video still waits for the owner's review.
  schedule: [{cron: "17 0 * * *"}]
  workflow_dispatch:
concurrency: { group: shorts-state, cancel-in-progress: false, queue: max }
permissions: { contents: write, issues: write }
jobs:
  produce:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      SHORTS_MODE: ${{ vars.SHORTS_MODE || 'dry_run' }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
      BFL_API_KEY: ${{ secrets.BFL_API_KEY }}
      YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
      YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
      YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v6
        with: { python-version: "3.12", cache: pip }
      - run: scripts/install_ffmpeg.sh
        timeout-minutes: 15
      - run: pip install -q -r requirements.txt
      - run: scripts/state_sync.sh pull
      - name: Refresh competitor signals (best effort)
        run: python scripts/collect_signals.py || echo "signals skipped"
      - name: Produce one Short
        run: |
          echo '{"action": "daily"}' > "$RUNNER_TEMP/req.json"
          set -o pipefail
          python scripts/run_command.py "$RUNNER_TEMP/req.json" 2>&1 | tee "$RUNNER_TEMP/out.log"
      - name: Save state
        if: always()
        run: scripts/state_sync.sh push
      - name: Tell the owner if this run crashed
        if: failure()
        run: |
          python scripts/post_failure_log.py "$RUNNER_TEMP/out.log" "Run ${{ github.run_id }} failed (produce)"
          python scripts/notify_failure.py "daily production run ${{ github.run_id }} failed"
