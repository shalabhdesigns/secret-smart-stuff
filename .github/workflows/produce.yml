# Daily production: refresh signals, keep the backlog full, make ONE Short, open a review issue.
name: produce
on:
  schedule:
    - cron: "17 0 * * *"        # 05:47 IST daily (off the hour: GitHub delays :00 jobs most)
  workflow_dispatch:
    inputs:
      topic:
        description: "Topic id to produce (blank = next best)"
        required: false
concurrency: { group: shorts-state, cancel-in-progress: false, queue: max }
permissions: { contents: write, issues: write }
jobs:
  produce:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SHORTS_MODE: ${{ vars.SHORTS_MODE || 'dry_run' }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
      BFL_API_KEY: ${{ secrets.BFL_API_KEY }}
      GH_TOKEN: ${{ github.token }}
      TOPIC: ${{ github.event.inputs.topic }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null
      - run: pip install -q -r requirements.txt
      - run: scripts/state_sync.sh pull
      - name: Refresh competitor signals (best effort)
        run: python scripts/collect_signals.py || echo "signals skipped"
      - name: Keep backlog full
        run: |
          n=$(python -m shorts.cli topics | grep -c '^shortlisted' || true)
          if [ "${n:-0}" -lt 5 ]; then python -m shorts.cli discover --n 8; fi
      - name: Produce one Short
        id: prod
        run: |
          if [ -n "$TOPIC" ]; then out=$(python -m shorts.cli produce --topic "$TOPIC" || true)
          else out=$(python -m shorts.cli produce || true); fi
          echo "$out"
          job=$(echo "$out" | python -c 'import sys,json; d=json.load(sys.stdin); print(d.get("job",""))' 2>/dev/null || true)
          status=$(echo "$out" | python -c 'import sys,json; d=json.load(sys.stdin); print(d.get("status",""))' 2>/dev/null || true)
          echo "job=$job" >> "$GITHUB_OUTPUT"; echo "status=$status" >> "$GITHUB_OUTPUT"
      - name: Open review issue
        if: steps.prod.outputs.status == 'review'
        env: { JOB: "${{ steps.prod.outputs.job }}" }
        run: scripts/open_review.sh "$JOB"
      - name: Auto-approve (only if approval.mode is auto and the video clears the bar)
        if: steps.prod.outputs.status == 'review'
        env:
          JOB: "${{ steps.prod.outputs.job }}"
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: python -m shorts.cli auto-approve "$JOB"
      - name: Alert on failure or budget pause
        if: steps.prod.outputs.status == 'failed' || steps.prod.outputs.status == 'paused'
        env: { JOB: "${{ steps.prod.outputs.job }}" }
        run: |
          gh label create alert --color B60205 2>/dev/null || true
          python -m shorts.cli status > status.txt
          gh issue create --label alert --title "Pipeline problem: $JOB" --body-file status.txt
      - name: Save state
        if: always()
        run: scripts/state_sync.sh push
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: build, path: build/**/review.md, retention-days: 14, if-no-files-found: ignore }
