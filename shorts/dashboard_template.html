<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Studio Dashboard</title>
<style>
:root{color-scheme:light;--bg:#f6f4ef;--surface:#fcfcfb;--line:#e4e1d8;--text:#0b0b0b;--text2:#52514e;--muted:#8a877e;
--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--good:#008300;--bad:#c53030;--accent:#F26B1D}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#121211;--surface:#1a1a19;--line:#2e2d2a;
--text:#f0efec;--text2:#c3c2b7;--muted:#8d8b83;--s1:#3987e5;--s2:#d95926;--s3:#199e70;--good:#3fae3f;--bad:#e66767}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#121211;--surface:#1a1a19;--line:#2e2d2a;--text:#f0efec;--text2:#c3c2b7;--muted:#8d8b83;
--s1:#3987e5;--s2:#d95926;--s3:#199e70;--good:#3fae3f;--bad:#e66767}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:10px 16px}
h1{font-size:17px;margin:0}small,.muted{color:var(--muted)}
nav{display:flex;gap:6px;overflow-x:auto;margin-top:8px;scrollbar-width:none}
nav button,.seg button{border:1px solid var(--line);background:var(--surface);color:var(--text2);padding:6px 11px;border-radius:999px;font:inherit;font-size:13px;white-space:nowrap;cursor:pointer}
nav button.on,.seg button.on{background:var(--text);color:var(--bg);border-color:var(--text)}
main{max-width:1100px;margin:0 auto;padding:14px 16px 60px}
section{display:none}section.on{display:block}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin:10px 0 16px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:11px 12px}
.tile b{display:block;font-size:22px;font-variant-numeric:tabular-nums;margin-top:2px}
.tile span{font-size:12px;color:var(--text2)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;margin:0 0 14px}
.card h2{font-size:15px;margin:0 0 4px}.card p.note{margin:2px 0 8px;font-size:12px;color:var(--muted)}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
th{color:var(--text2);font-weight:600;cursor:pointer;position:sticky;top:0;background:var(--surface)}
td.n,th.n{text-align:right}
tr.click{cursor:pointer}tr.click:hover{background:color-mix(in srgb,var(--s1) 8%,transparent)}
.seg{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 2px}
.pill{display:inline-block;padding:1px 8px;border-radius:999px;font-size:12px;border:1px solid var(--line);color:var(--text2)}
.ok{color:var(--good)}.bad{color:var(--bad)}
svg text{fill:var(--text2);font-size:10px}
.tip{position:fixed;pointer-events:none;background:var(--text);color:var(--bg);padding:6px 8px;border-radius:8px;font-size:12px;display:none;z-index:9}
pre{white-space:pre-wrap;font:13px/1.5 system-ui,sans-serif;margin:0}
.empty{color:var(--muted);font-style:italic;padding:6px 0}
dialog{border:1px solid var(--line);border-radius:14px;background:var(--surface);color:var(--text);max-width:720px;width:calc(100% - 24px)}
dialog::backdrop{background:#0006}
a{color:var(--s1)}
</style>
</head>
<body>
<header>
  <h1>Secret Smart Stuff · Studio</h1>
  <small id="fresh"></small>
  <nav id="tabs"></nav>
</header>
<main>
  <div class="seg" id="period"></div>
  <section id="overview"></section>
  <section id="videos"></section>
  <section id="production"></section>
  <section id="money"></section>
  <section id="strategy"></section>
  <section id="learning"></section>
</main>
<div class="tip" id="tip"></div>
<dialog id="dlg"><div id="dlgBody"></div><p><button onclick="dlg.close()">Close</button></p></dialog>
<script>
const D = /*__DATA__*/null;
const $ = (s) => document.querySelector(s);
const fmt = (n, d = 0) => n == null || isNaN(n) ? "–" : Number(n).toLocaleString("en-US", { maximumFractionDigits: d, minimumFractionDigits: d });
const usd = (n) => n == null ? "–" : (n < 0 ? "−$" : "$") + fmt(Math.abs(n), 2);
const pct = (n) => n == null ? "–" : fmt(n, 1) + "%";
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const day = (iso) => iso ? iso.slice(0, 10) : "–";
const PERIODS = [["7", "7 days"], ["30", "30 days"], ["90", "90 days"], ["365", "Year"], ["all", "All time"]];
let period = "30";
try { period = localStorage.getItem("period") || "30"; } catch (e) {}
const TABS = [["overview", "Overview"], ["videos", "Videos"], ["production", "Production"], ["money", "Money"], ["strategy", "What works"], ["learning", "Experiments & learnings"]];
let tab = "overview";

function since() { if (period === "all") return "0000"; const d = new Date(Date.now() - (+period) * 864e5); return d.toISOString().slice(0, 10); }
function inPeriod(dayStr) { return dayStr && dayStr >= since(); }
function sum(a, f) { return a.reduce((s, x) => s + (+f(x) || 0), 0); }
function median(a) { a = a.filter((x) => x != null && !isNaN(x)).sort((x, y) => x - y); if (!a.length) return null; const m = a.length >> 1; return a.length % 2 ? a[m] : (a[m - 1] + a[m]) / 2; }

function lineChart(points, key, label, color) {
  if (!points.length) return `<div class="empty">No data yet for this period.</div>`;
  const W = 360, H = 170, P = 24, xs = points.map((_, i) => P + i * (W - 2 * P) / Math.max(1, points.length - 1));
  const max = Math.max(1, ...points.map((p) => +p[key] || 0));
  const ys = points.map((p) => H - 20 - (+p[key] || 0) / max * (H - 40));
  const d = xs.map((x, i) => (i ? "L" : "M") + x.toFixed(1) + " " + ys[i].toFixed(1)).join(" ");
  const id = "c" + Math.random().toString(36).slice(2);
  setTimeout(() => {
    const svg = document.getElementById(id); if (!svg) return;
    const cross = svg.querySelector(".cross"), dot = svg.querySelector(".dot");
    svg.onpointermove = (e) => {
      const r = svg.getBoundingClientRect(), x = (e.clientX - r.left) / r.width * W;
      let i = 0, best = 1e9; xs.forEach((v, k) => { if (Math.abs(v - x) < best) { best = Math.abs(v - x); i = k; } });
      cross.setAttribute("x1", xs[i]); cross.setAttribute("x2", xs[i]); cross.style.display = "";
      dot.setAttribute("cx", xs[i]); dot.setAttribute("cy", ys[i]); dot.style.display = "";
      tip.style.display = "block"; tip.style.left = e.clientX + 12 + "px"; tip.style.top = e.clientY - 30 + "px";
      tip.textContent = `${points[i].day}: ${fmt(points[i][key])} ${label}`;
    };
    svg.onpointerleave = () => { tip.style.display = "none"; cross.style.display = "none"; dot.style.display = "none"; };
  });
  return `<svg id="${id}" viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="${label} per day">
    <line x1="${P}" x2="${W - P}" y1="${H - 20}" y2="${H - 20}" stroke="var(--line)"/>
    <text x="${P}" y="12">${fmt(max)}</text><text x="${P}" y="${H - 4}">${points[0].day}</text>
    <text x="${W - P}" y="${H - 4}" text-anchor="end">${points[points.length - 1].day}</text>
    <path d="${d}" fill="none" stroke="${color}" stroke-width="2" stroke-linejoin="round"/>
    <line class="cross" y1="10" y2="${H - 20}" stroke="var(--muted)" stroke-dasharray="3 3" style="display:none"/>
    <circle class="dot" r="4" fill="${color}" stroke="var(--surface)" stroke-width="2" style="display:none"/></svg>`;
}

function barChart(rows, key, labelKey, color, fmtFn) {
  if (!rows.length) return `<div class="empty">No data yet.</div>`;
  const max = Math.max(...rows.map((r) => r[key] || 0), 0.0001);
  return rows.map((r) => `<div style="display:flex;align-items:center;gap:8px;margin:4px 0" title="${esc(r[labelKey])}: ${fmtFn(r[key])}">
    <div style="width:38%;font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(r[labelKey])}</div>
    <div style="flex:1;background:var(--line);border-radius:4px;height:12px"><div style="width:${(r[key] || 0) / max * 100}%;background:${color};height:12px;border-radius:4px"></div></div>
    <div style="width:70px;text-align:right;font-size:12px">${fmtFn(r[key])}</div></div>`).join("");
}

function table(cols, rows, onclick) {
  if (!rows.length) return `<div class="empty">Nothing yet.</div>`;
  const id = "t" + Math.random().toString(36).slice(2);
  setTimeout(() => {
    const t = document.getElementById(id); if (!t) return;
    t.querySelectorAll("th").forEach((th, ci) => th.onclick = () => {
      const dir = th.dataset.dir === "a" ? "d" : "a"; th.dataset.dir = dir;
      const body = t.tBodies[0], trs = [...body.rows];
      trs.sort((x, y) => { const a = x.cells[ci].dataset.v, b = y.cells[ci].dataset.v; const na = parseFloat(a), nb = parseFloat(b);
        const c = !isNaN(na) && !isNaN(nb) ? na - nb : String(a).localeCompare(String(b)); return dir === "a" ? c : -c; });
      trs.forEach((r) => body.appendChild(r));
    });
    if (onclick) t.querySelectorAll("tr.click").forEach((tr) => tr.onclick = () => onclick(tr.dataset.k));
  });
  return `<div class="scroll"><table id="${id}"><thead><tr>${cols.map((c) => `<th class="${c.n ? "n" : ""}">${c.h}</th>`).join("")}</tr></thead><tbody>${
    rows.map((r) => `<tr class="${onclick ? "click" : ""}" data-k="${esc(r._k || "")}">${cols.map((c) => {
      const v = c.v(r); return `<td class="${c.n ? "n" : ""}" data-v="${esc(c.sort ? c.sort(r) : v)}">${c.f ? c.f(r) : esc(v)}</td>`; }).join("")}</tr>`).join("")
  }</tbody></table></div>`;
}

const V = D.videos || [];
const m = (v, k) => (v.latest || {})[k];

function overview() {
  const daily = D.daily.filter((d) => inPeriod(d.day));
  const costs = D.costs.filter((c) => inPeriod(c.day));
  // revenue: YouTube's daily estimate when available, otherwise the owner's monthly entries
  const apiDaily = daily.filter((d) => d.estimatedRevenue != null);
  const rev = apiDaily.length ? apiDaily.map((d) => ({ usd: d.estimatedRevenue }))
    : D.revenue.filter((r) => r.source === "owner" && (period === "all" || r.period >= since().slice(0, r.period.length)));
  const pub = V.filter((v) => v.publish_at && inPeriod(day(v.publish_at)));
  const views = sum(daily, (d) => d.views), cost = sum(costs, (c) => c.usd), revenue = sum(rev, (r) => r.usd);
  const waiting = D.jobs.filter((j) => j.status === "review");
  return `<div class="tiles">
    <div class="tile"><span>Videos published</span><b>${fmt(pub.length)}</b></div>
    <div class="tile"><span>Views (channel)</span><b>${daily.length ? fmt(views) : "–"}</b></div>
    <div class="tile"><span>Engaged views</span><b>${daily.length ? fmt(sum(daily, (d) => d.engagedViews)) : "–"}</b></div>
    <div class="tile"><span>Watch time (hours)</span><b>${daily.length ? fmt(sum(daily, (d) => d.estimatedMinutesWatched) / 60, 1) : "–"}</b></div>
    <div class="tile"><span>Subscribers (net)</span><b>${daily.length ? fmt(sum(daily, (d) => (d.subscribersGained || 0) - (d.subscribersLost || 0))) : "–"}</b></div>
    <div class="tile"><span>Production cost</span><b>${usd(cost)}</b></div>
    <div class="tile"><span>Revenue${apiDaily.length ? " (YouTube estimate)" : " (your entries)"}</span><b>${rev.length ? usd(revenue) : "–"}</b></div>
    <div class="tile"><span>Waiting for your review</span><b>${waiting.length}</b></div>
  </div>
  <div class="card"><h2>Channel views per day</h2><p class="note">Source: YouTube Analytics (channel totals). Views and engaged views are different metrics; YouTube data usually lags 1–3 days.</p>
  ${lineChart(daily, "views", "views", "var(--s1)")}</div>
  <div class="card"><h2>Latest videos</h2>${videoTable(V.slice().sort((a, b) => (b.publish_at || "").localeCompare(a.publish_at || "")).slice(0, 5))}</div>
  ${waiting.length ? `<div class="card"><h2>Waiting for review</h2>${waiting.map((j) => `<div>${esc(j.title || j.id)} <span class="pill">${esc(j.id)}</span></div>`).join("")}<p class="note">Review in Telegram.</p></div>` : ""}`;
}

function videoTable(rows) {
  return table([
    { h: "Video", v: (v) => v.title, f: (v) => `<a href="${esc(v.url)}" target="_blank" rel="noopener">${esc((v.title || "").slice(0, 48))}</a>` },
    { h: "Published", v: (v) => day(v.publish_at) },
    { h: "State", v: (v) => v.status },
    { h: "Views", n: 1, v: (v) => m(v, "views") ?? "", f: (v) => fmt(m(v, "views")) },
    { h: "Engaged", n: 1, v: (v) => m(v, "engagedViews") ?? "", f: (v) => fmt(m(v, "engagedViews")) },
    { h: "Avg % viewed", n: 1, v: (v) => m(v, "averageViewPercentage") ?? "", f: (v) => pct(m(v, "averageViewPercentage")) },
    { h: "Avg view (s)", n: 1, v: (v) => m(v, "averageViewDuration") ?? "", f: (v) => fmt(m(v, "averageViewDuration")) },
    { h: "Likes", n: 1, v: (v) => m(v, "likes") ?? "", f: (v) => fmt(m(v, "likes")) },
    { h: "Comments", n: 1, v: (v) => m(v, "comments") ?? "", f: (v) => fmt(m(v, "comments")) },
    { h: "Shares", n: 1, v: (v) => m(v, "shares") ?? "", f: (v) => fmt(m(v, "shares")) },
    { h: "Subs +", n: 1, v: (v) => m(v, "subscribersGained") ?? "", f: (v) => fmt(m(v, "subscribersGained")) },
    { h: "Cost", n: 1, v: (v) => v.cost, f: (v) => usd(v.cost) },
    { h: "Revenue", n: 1, v: (v) => v.revenue ?? "", f: (v) => usd(v.revenue) },
  ], rows.map((v) => ({ ...v, _k: v.video_id })), openVideo);
}

function openVideo(id) {
  const v = V.find((x) => x.video_id === id); if (!v) return;
  const f = v.features || {};
  const ret = v.retention && v.retention.length ? lineChart(v.retention.map((r) => ({ day: Math.round(r.elapsedVideoTimeRatio * 100) + "%", w: r.audienceWatchRatio * 100 })), "w", "% still watching", "var(--s1)") : `<div class="empty">Retention curve not available yet.</div>`;
  const tr = v.traffic && v.traffic.length ? barChart(v.traffic.map((t) => ({ k: t.insightTrafficSourceType, n: t.views })), "n", "k", "var(--s1)", (x) => fmt(x)) : `<div class="empty">Traffic sources not available yet.</div>`;
  const ages = ["d1", "d3", "d7", "d28"].map((k) => `<td class="n">${v[k] ? fmt(v[k].views) : "–"}</td>`).join("");
  $("#dlgBody").innerHTML = `<h2 style="font-size:16px">${esc(v.title)}</h2><p><a href="${esc(v.url)}" target="_blank" rel="noopener">${esc(v.url)}</a> · ${esc(v.status)} · published ${day(v.publish_at)}</p>
    <div class="scroll"><table><tr><th>Views at</th><th class="n">1 day</th><th class="n">3 days</th><th class="n">7 days</th><th class="n">28 days</th></tr><tr><td>views</td>${ages}</tr></table></div>
    <h3 style="font-size:14px">Audience retention</h3>${ret}<h3 style="font-size:14px">Traffic sources</h3>${tr}
    <h3 style="font-size:14px">What it was made of</h3><div class="scroll"><table>${Object.entries({ ...f, ...Object.fromEntries(Object.entries(v.arms || {}).map(([k, a]) => ["experiment " + k, a])) })
      .map(([k, x]) => `<tr><td>${esc(k)}</td><td>${esc(typeof x === "object" ? JSON.stringify(x) : x)}</td></tr>`).join("")}</table></div>
    <p class="note">Cost ${usd(v.cost)} · revenue ${usd(v.revenue)} · net ${v.revenue != null ? usd(v.revenue - v.cost) : "–"}</p>`;
  dlg.showModal();
}

function videos() {
  return `<div class="card"><h2>All published videos</h2><p class="note">Lifetime totals from the latest pull (${day(D.metrics_fetched_at)}). Tap a row for retention, traffic sources and what it was made of. Tap a header to sort.</p>${videoTable(V)}</div>`;
}

function production() {
  const sc = D.status_counts || {};
  const jobs = D.jobs.filter((j) => inPeriod(day(j.created)));
  const done = jobs.filter((j) => j.reached_review).length;
  const failed = jobs.filter((j) => !j.reached_review && !["running", "paused"].includes(j.status)).length;
  const mm = D.make_minutes || [];
  return `<div class="tiles">
    <div class="tile"><span>Versions started (period)</span><b>${jobs.length}</b></div>
    <div class="tile"><span>Reached review</span><b>${done}</b></div>
    <div class="tile"><span>Never finished</span><b class="${failed ? "bad" : ""}">${failed}</b></div>
    <div class="tile"><span>Finish rate</span><b>${jobs.length ? pct(done / jobs.length * 100) : "–"}</b></div>
    <div class="tile"><span>Median time to make</span><b>${mm.length ? fmt(median(mm)) + " min" : "–"}</b></div>
    <div class="tile"><span>Topics in backlog</span><b>${D.topics_backlog}</b></div></div>
  <div class="card"><h2>Pipeline status (all time)</h2>${Object.entries(sc).map(([k, n]) => `<span class="pill">${esc(k)}: ${n}</span>`).join(" ")}
   <p class="note">"rejected" includes versions superseded by a newer version and topics you dropped.</p></div>
  <div class="card"><h2>All versions</h2>${table([
    { h: "Version", v: (j) => j.id }, { h: "Topic", v: (j) => (j.title || "").slice(0, 50) }, { h: "Status", v: (j) => j.status },
    { h: "Stage", v: (j) => j.stage }, { h: "Started", v: (j) => day(j.created) }, { h: "Cost", n: 1, v: (j) => j.cost, f: (j) => usd(j.cost) },
    { h: "Error", v: (j) => (j.error || "").slice(0, 80) }], jobs.slice().reverse())}</div>
  <div class="card"><h2>Problems (latest)</h2>${table([{ h: "When", v: (e) => (e.at || "").replace("T", " ").slice(0, 16) }, { h: "Level", v: (e) => e.level },
    { h: "Video", v: (e) => e.job_id || "" }, { h: "Message", v: (e) => e.message.slice(0, 140) }], D.events.slice(0, 20))}</div>
  <div class="card"><h2>Your decisions</h2>${table([{ h: "When", v: (f) => (f.at || "").slice(0, 10) }, { h: "Decision", v: (f) => f.decision },
    { h: "Video", v: (f) => f.job_id || "" }, { h: "Note", v: (f) => (f.note || "").slice(0, 120) }], D.feedback)}</div>`;
}

function money() {
  const costs = D.costs.filter((c) => inPeriod(c.day));
  const byProv = {}; costs.forEach((c) => byProv[c.provider] = (byProv[c.provider] || 0) + c.usd);
  const byJob = {}; costs.forEach((c) => { if (c.job) byJob[c.job] = (byJob[c.job] || 0) + c.usd; });
  const fixedMonth = sum(Object.values(D.fixed_monthly || {}), (x) => x);
  const apiRev = D.revenue.filter((r) => r.source === "youtube_api_estimate");
  const allRev = apiRev.length ? sum(apiRev, (r) => r.usd) : sum(D.revenue.filter((r) => r.source === "owner"), (r) => r.usd);
  const months = D.months_active;
  const cash = D.api_cash + fixedMonth * months;
  const roi = cash > 0 ? (allRev - cash) / cash * 100 : null;
  const pubCosts = V.map((v) => v.cost).filter((x) => x > 0);
  return `<div class="tiles">
    <div class="tile"><span>Logged cost (period)</span><b>${usd(sum(costs, (c) => c.usd))}</b></div>
    <div class="tile"><span>Median cost per published video</span><b>${usd(median(pubCosts))}</b></div>
    <div class="tile"><span>Revenue to date</span><b>${D.revenue.length ? usd(allRev) : "–"}</b></div>
    <div class="tile"><span>Cash spent to date</span><b>${usd(cash)}</b></div>
    <div class="tile"><span>Net (revenue − cash)</span><b class="${allRev - cash >= 0 ? "ok" : "bad"}">${usd(allRev - cash)}</b></div>
    <div class="tile"><span>ROI</span><b>${roi == null ? "–" : pct(roi)}</b></div></div>
  <div class="card"><h2>How these are calculated</h2><p class="note">
    <b>Logged cost</b> = every API call the pipeline made (Claude, images) plus an estimate of the voice's share of the ElevenLabs plan.
    <b>Cash spent</b> = API spend excluding ElevenLabs (${usd(D.api_cash)}) + fixed monthly plans (${usd(fixedMonth)}/month × ${fmt(months, 1)} months) so the voice is not counted twice.
    <b>ROI</b> = (revenue − cash spent) ÷ cash spent. <b>Break-even</b> when net ≥ 0.
    Revenue comes only from what you record (Telegram: /revenue 2026-11 12.50) or from YouTube once the channel is monetised and revenue access is granted. Views are never treated as revenue.</p></div>
  <div class="card"><h2>Cost by provider (period)</h2>${barChart(Object.entries(byProv).map(([k, n]) => ({ k, n })).sort((a, b) => b.n - a.n), "n", "k", "var(--s2)", usd)}</div>
  <div class="card"><h2>Cost per version (period)</h2><p class="note">Includes test versions and re-makes.</p>${barChart(Object.entries(byJob).map(([k, n]) => ({ k, n })).sort((a, b) => b.n - a.n).slice(0, 15), "n", "k", "var(--s2)", usd)}</div>
  <div class="card"><h2>Revenue entries</h2>${table([{ h: "Period", v: (r) => r.period }, { h: "Video", v: (r) => r.video_id || "whole channel" },
    { h: "Source", v: (r) => r.source }, { h: "USD", n: 1, v: (r) => r.usd, f: (r) => usd(r.usd) }], D.revenue)}</div>`;
}

function compare(label, keyFn) {
  const groups = {};
  V.forEach((v) => { if (!v.d7) return; const k = keyFn(v); if (k == null) return; (groups[k] = groups[k] || []).push(v); });
  const rows = Object.entries(groups).map(([k, vs]) => ({ k, n: vs.length, views: median(vs.map((v) => v.d7.views)),
    pctv: median(vs.map((v) => v.d7.averageViewPercentage)), subs: median(vs.map((v) => v.d7.subscribersGained)), cost: median(vs.map((v) => v.cost)) }));
  return `<div class="card"><h2>By ${label}</h2>${rows.length ? table([{ h: label, v: (r) => r.k }, { h: "Videos", n: 1, v: (r) => r.n },
    { h: "Median views @7d", n: 1, v: (r) => r.views ?? "", f: (r) => fmt(r.views) }, { h: "Median % viewed", n: 1, v: (r) => r.pctv ?? "", f: (r) => pct(r.pctv) },
    { h: "Median subs @7d", n: 1, v: (r) => r.subs ?? "", f: (r) => fmt(r.subs) }, { h: "Median cost", n: 1, v: (r) => r.cost ?? "", f: (r) => usd(r.cost) },
    { h: "Read it?", v: (r) => r.n >= 5 ? "enough data" : "too few", f: (r) => r.n >= 5 ? `<span class="ok">enough data</span>` : `<span class="muted">too few (n=${r.n})</span>` }], rows)
    : `<div class="empty">Needs videos that are at least 7 days old.</div>`}</div>`;
}

function strategy() {
  const lenB = (v) => { const s = (v.features || {}).seconds; return s ? (s < 30 ? "< 30 s" : s < 36 ? "30–36 s" : "36 s +") : null; };
  return `<div class="card"><p class="note">All comparisons use each video's numbers at <b>7 days old</b>, so young videos are not judged early. Medians, not averages (one viral video won't skew them). Groups under 5 videos are marked "too few" — treat them as hints, not conclusions.</p></div>
  ${compare("topic pillar", (v) => v.pillar)}
  ${compare("publish slot (UTC)", (v) => (v.features || {}).publish_slot_utc)}
  ${compare("hook formula", (v) => (v.features || {}).hook_formula)}
  ${compare("length", lenB)}
  ${compare("witty lines", (v) => (v.features || {}).wit_lines)}
  ${compare("music bed", (v) => (v.features || {}).music)}
  <div class="card"><h2>Watched vs. kept</h2><p class="note">Videos with many views but low % viewed attract clicks but lose viewers.</p>${table([
    { h: "Video", v: (v) => (v.title || "").slice(0, 50) }, { h: "Views @7d", n: 1, v: (v) => v.d7 ? v.d7.views : "", f: (v) => v.d7 ? fmt(v.d7.views) : "–" },
    { h: "% viewed @7d", n: 1, v: (v) => v.d7 ? v.d7.averageViewPercentage : "", f: (v) => v.d7 ? pct(v.d7.averageViewPercentage) : "–" },
    { h: "Subs/1k views", n: 1, v: (v) => v.d7 && v.d7.views ? v.d7.subscribersGained / v.d7.views * 1000 : "", f: (v) => v.d7 && v.d7.views ? fmt(v.d7.subscribersGained / v.d7.views * 1000, 1) : "–" }],
    V.filter((v) => v.d7))}</div>`;
}

function learning() {
  return `<div class="card"><h2>Experiments</h2>${(D.experiments || []).map((e) => {
      const n = {}; V.forEach((v) => { const a = (v.arms || {})[e.id]; if (a) n[a] = (n[a] || 0) + 1; });
      return `<div style="margin:6px 0"><b>${esc(e.id)}</b> <span class="pill">${esc(e.status)}</span><br><small>${esc(e.hypothesis)}</small><br>${
        Object.keys(e.arms || {}).map((a) => `<span class="pill">${esc(a)}: ${n[a] || 0}/${e.min_videos_per_arm} published</span>`).join(" ")}</div>`;
    }).join("") || `<div class="empty">No experiments.</div>`}</div>
  <div class="card"><h2>Learnings (weekly)</h2>${D.learnings ? `<pre>${esc(D.learnings)}</pre>` : `<div class="empty">The first weekly learning report appears once videos have 7 days of data.</div>`}</div>`;
}

const RENDER = { overview, videos, production, money, strategy, learning };
function render() {
  $("#tabs").innerHTML = TABS.map(([k, l]) => `<button class="${k === tab ? "on" : ""}" data-k="${k}">${l}</button>`).join("");
  $("#tabs").querySelectorAll("button").forEach((b) => b.onclick = () => { tab = b.dataset.k; render(); });
  $("#period").innerHTML = PERIODS.map(([k, l]) => `<button class="${k === period ? "on" : ""}" data-k="${k}">${l}</button>`).join("");
  $("#period").querySelectorAll("button").forEach((b) => b.onclick = () => { period = b.dataset.k; try { localStorage.setItem("period", period); } catch (e) {} render(); });
  document.querySelectorAll("section").forEach((s) => s.classList.toggle("on", s.id === tab));
  $("#" + tab).innerHTML = RENDER[tab]();
}
$("#fresh").textContent = `Built ${(D.generated_at || "").replace("T", " ").slice(0, 16)} UTC · YouTube data pulled ${D.metrics_fetched_at ? D.metrics_fetched_at.replace("T", " ").slice(0, 16) + " UTC" : "not yet"}`;
const tip = $("#tip"), dlg = $("#dlg");
render();
</script>
</body>
</html>
