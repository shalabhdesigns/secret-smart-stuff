<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Studio Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light;--bg:#ffffff;--surface:#f7f8ff;--line:#e3e6fb;--text:#0d1440;--text2:#4a5180;--muted:#8a8fb3;
--brand:#1F3BFF;--blush:#FFD6E0;--yt:#1F3BFF;--ig:#d23f71;--good:#178a4a;--warn:#b86e00;--bad:#c62828;--grey:#8a8fb3}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#0b0e24;--surface:#121638;--line:#252a57;
--text:#eef0ff;--text2:#b9bde4;--muted:#7d82b0;--brand:#6c80ff;--blush:#ffd6e0;--yt:#6c80ff;--ig:#ff7aa6;--good:#4cc283;--warn:#f0a63a;--bad:#ff6b6b}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#0b0e24;--surface:#121638;--line:#252a57;--text:#eef0ff;--text2:#b9bde4;--muted:#7d82b0;
--brand:#6c80ff;--blush:#ffd6e0;--yt:#6c80ff;--ig:#ff7aa6;--good:#4cc283;--warn:#f0a63a;--bad:#ff6b6b}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 Archivo,system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:10px 16px}
.hrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap;max-width:1180px;margin:0 auto}
h1{font-size:17px;margin:0;font-weight:800;color:var(--brand)}
small,.muted{color:var(--muted)}
nav{display:flex;gap:6px;overflow-x:auto;max-width:1180px;margin:8px auto 0;scrollbar-width:none}
.btn,nav button,.seg button{border:1px solid var(--line);background:var(--surface);color:var(--text2);padding:6px 11px;border-radius:999px;
 font:inherit;font-size:13px;white-space:nowrap;cursor:pointer}
nav button.on,.seg button.on{background:var(--brand);color:#fff;border-color:var(--brand)}
.btn.primary{background:var(--brand);color:#fff;border-color:var(--brand)}
main{max-width:1180px;margin:0 auto;padding:14px 16px 70px}
section{display:none}section.on{display:block}
.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:4px 0 12px}
.bar input,.bar select{font:inherit;font-size:13px;padding:6px 10px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--text)}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(150px,45%),1fr));gap:10px;margin:6px 0 16px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.tile b{display:block;font-size:22px;font-weight:800;font-variant-numeric:tabular-nums;margin-top:2px}
.tile span{font-size:12px;color:var(--text2)}.tile i{font-style:normal;font-size:11px;color:var(--muted);display:block}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(340px,100%),1fr));gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;margin:0 0 14px;min-width:0}
.card h2{font-size:15px;margin:0 0 4px;font-weight:800}.card h3{font-size:13px;margin:10px 0 4px}
p.note{margin:2px 0 8px;font-size:12px;color:var(--muted)}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap;vertical-align:top}
th{color:var(--text2);font-weight:600;cursor:pointer;position:sticky;top:0;background:var(--surface)}
td.n,th.n{text-align:right}td.wrap{white-space:normal;min-width:180px}
tr.click{cursor:pointer}tr.click:hover{background:color-mix(in srgb,var(--brand) 7%,transparent)}
.lbl{display:inline-block;padding:0 6px;border-radius:999px;font-size:10px;font-weight:600;letter-spacing:.02em;border:1px solid currentColor;margin-left:4px;vertical-align:1px;cursor:help}
.l-measured{color:var(--good)}.l-calculated{color:var(--brand)}.l-allocated{color:#7a4cc9}.l-estimated{color:var(--warn)}
.l-manual{color:var(--ig)}.l-unavailable{color:var(--grey)}
.st{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:700;color:#fff}
.st-Healthy{background:var(--good)}.st-Running.low,.st-Runninglow{background:var(--warn)}.st-Critical{background:var(--bad)}
.st-Expired{background:#5b1111}.st-Unknown{background:var(--grey)}
.meter{height:8px;border-radius:99px;background:var(--line);overflow:hidden;margin:6px 0}
.meter>div{height:100%;background:var(--brand)}
.res{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(270px,100%),1fr));gap:10px}
.res .card{margin:0}
.kv{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;font-size:13px}.kv dt{color:var(--text2)}.kv dd{margin:0;text-align:right;font-variant-numeric:tabular-nums}
.empty{color:var(--muted);font-style:italic;padding:6px 0}
dialog{border:1px solid var(--line);border-radius:14px;background:var(--bg);color:var(--text);max-width:980px;width:calc(100% - 24px);padding:0}
dialog .dh{position:sticky;top:0;background:var(--bg);border-bottom:1px solid var(--line);padding:12px 14px;display:flex;gap:10px;align-items:center}
dialog .db{padding:12px 14px}
dialog::backdrop{background:#0008}
a{color:var(--brand)}
pre{white-space:pre-wrap;font:13px/1.55 Archivo,system-ui,sans-serif;margin:0}
.svgc svg{width:100%;height:auto;display:block}
svg text{fill:var(--text2);font-size:10px;font-family:inherit}
.tip{position:fixed;pointer-events:none;background:var(--text);color:var(--bg);padding:6px 8px;border-radius:8px;font-size:12px;display:none;z-index:99;max-width:280px}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--text2)}.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px;background:var(--c)}
.both{color:var(--text2)}.only{font-size:10px;color:var(--muted)}
form.inline{display:flex;gap:6px;flex-wrap:wrap;align-items:end;margin:6px 0}
form.inline label{display:flex;flex-direction:column;font-size:11px;color:var(--text2);gap:2px}
form.inline input,form.inline select,textarea{max-width:100%;font:inherit;font-size:13px;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--text);min-width:90px}
.act li{margin:4px 0}
@media (max-width:600px){.tile b{font-size:19px}th,td{padding:5px 6px}}
</style>
</head>
<body>
<header>
  <div class="hrow"><h1>Secret Smart Stuff · Studio</h1><small id="fresh"></small><span style="flex:1"></span>
    <button class="btn" id="refresh" title="Pull fresh numbers now (takes ~3 minutes)">↻ Refresh now</button></div>
  <nav id="tabs"></nav>
</header>
<main>
  <div class="bar" id="filters">
    <span class="muted">Period</span><span class="seg" id="period"></span>
    <span class="muted">Type</span><select id="kind"><option value="all">All videos</option><option value="daily">Daily</option><option value="news">News tie-ins</option></select>
    <input id="q" placeholder="Search title…" size="16">
  </div>
  <section id="overview"></section>
  <section id="videos"></section>
  <section id="money"></section>
  <section id="resources"></section>
  <section id="learning"></section>
  <section id="data"></section>
</main>
<dialog id="dlg"><div class="dh"><b id="dlgt" style="flex:1"></b><button class="btn" onclick="dlg.close()">Close</button></div><div class="db" id="dlgb"></div></dialog>
<div class="tip" id="tip"></div>
<script>
const D = /*__DATA__*/null;
const $ = (s, r = document) => r.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const nf = (x, d = 0) => (x === null || x === undefined || Number.isNaN(x)) ? "—" : Number(x).toLocaleString("en-US", { maximumFractionDigits: d, minimumFractionDigits: d });
const usd = (x, d = 2) => (x === null || x === undefined) ? "—" : (x < 0 ? "−$" : "$") + nf(Math.abs(x), d);
const pct = (x, d = 0) => (x === null || x === undefined) ? "—" : nf(x, d) + "%";
const day = (s) => s ? String(s).slice(0, 10) : "—";
const LBL = {
  measured: "Reported by the service's API, or counted by our own runs.",
  calculated: "Measured usage × the provider's list price. Not an invoice.",
  allocated: "A shared cost split by the rule shown (subscription, overhead or dropped attempts).",
  estimated: "List price per item, because the provider reported no cost for it.",
  manual: "Typed in by you on this dashboard (date shown).",
  unavailable: "The platform has no API for this.",
};
const lbl = (l) => l ? `<span class="lbl l-${l}" data-tip="${esc(LBL[l] || l)}">${esc(l)}</span>` : "";
const st = (s) => `<span class="st st-${String(s).replace(/\s/g, "")}">${esc(s)}</span>`;

// ---------- tooltips ----------
const tip = $("#tip");
document.addEventListener("mouseover", (e) => { const t = e.target.closest("[data-tip]"); if (!t) { tip.style.display = "none"; return; }
  tip.innerHTML = t.dataset.tip; tip.style.display = "block"; });
document.addEventListener("mousemove", (e) => { tip.style.left = Math.min(e.clientX + 12, innerWidth - 290) + "px"; tip.style.top = (e.clientY + 14) + "px"; });

// ---------- filters ----------
let PERIOD = "30", KIND = "all", Q = "", SORT = { k: "published", d: -1 };
const periods = [["7", "7 days"], ["30", "30 days"], ["90", "90 days"], ["all", "All time"]];
$("#period").innerHTML = periods.map(([v, t]) => `<button data-p="${v}" class="${v === PERIOD ? "on" : ""}">${t}</button>`).join("");
$("#period").onclick = (e) => { const b = e.target.closest("button"); if (!b) return; PERIOD = b.dataset.p;
  [...$("#period").children].forEach((x) => x.classList.toggle("on", x === b)); render(); };
$("#kind").onchange = (e) => { KIND = e.target.value; render(); };
$("#q").oninput = (e) => { Q = e.target.value.toLowerCase(); render(); };
const since = () => PERIOD === "all" ? 0 : Date.now() - Number(PERIOD) * 86400e3;
const vids = () => D.videos.filter((v) => (Date.parse(v.published) || 0) >= since()
  && (KIND === "all" || (KIND === "news") === !!v.news) && (!Q || v.title.toLowerCase().includes(Q)));
const ytViews = (v) => v.yt_live?.views ?? v.yt?.views ?? null;
const igViews = (v) => v.ig?.views ?? null;
const sum = (a) => a.reduce((s, x) => s + (Number(x) || 0), 0);
const median = (a) => { a = a.filter((x) => x !== null && x !== undefined).sort((x, y) => x - y); if (!a.length) return null;
  const m = Math.floor(a.length / 2); return a.length % 2 ? a[m] : (a[m - 1] + a[m]) / 2; };
const engRate = (v) => { const vw = (ytViews(v) || 0) + (igViews(v) || 0); if (!vw) return null;
  const e = (v.yt_live?.likes ?? v.yt?.likes ?? 0) + (v.yt_live?.comments ?? v.yt?.comments ?? 0) + (v.yt?.shares ?? 0)
    + (v.ig?.likes ?? 0) + (v.ig?.comments ?? 0) + (v.ig?.shares ?? 0) + (v.ig?.saved ?? 0); return 100 * e / vw; };

// ---------- tiny SVG charts ----------
function lineChart(series, { h = 180, yfmt = (x) => nf(x), xs = null } = {}) {
  const W = 640, H = h, L = 42, R = 10, T = 10, B = 24;
  const pts = series.flatMap((s) => s.pts); if (!pts.length) return `<p class="empty">No data yet.</p>`;
  const xMin = Math.min(...pts.map((p) => p.x)), xMax = Math.max(...pts.map((p) => p.x)) || 1;
  const yMax = Math.max(1, ...pts.map((p) => p.y));
  const X = (x) => L + (W - L - R) * (xMax === xMin ? 0.5 : (x - xMin) / (xMax - xMin)), Y = (y) => T + (H - T - B) * (1 - y / yMax);
  let g = "";
  for (let i = 0; i <= 4; i++) { const y = yMax * i / 4; g += `<line x1="${L}" x2="${W - R}" y1="${Y(y)}" y2="${Y(y)}" stroke="var(--line)"/><text x="${L - 6}" y="${Y(y) + 3}" text-anchor="end">${esc(yfmt(y))}</text>`; }
  (xs || []).forEach(([x, t]) => { g += `<text x="${X(x)}" y="${H - 6}" text-anchor="middle">${esc(t)}</text>`; });
  for (const s of series) {
    if (!s.pts.length) continue;
    g += `<polyline fill="none" stroke="${s.c}" stroke-width="2" points="${s.pts.map((p) => `${X(p.x)},${Y(p.y)}`).join(" ")}"/>`;
    g += s.pts.map((p) => `<circle cx="${X(p.x)}" cy="${Y(p.y)}" r="3" fill="${s.c}" data-tip="${esc(s.name)}: ${esc(p.t || "")} ${esc(yfmt(p.y))}"/>`).join("");
  }
  return `<div class="svgc"><svg viewBox="0 0 ${W} ${H}">${g}</svg></div>`;
}
function barChart(rows, keys, { h = 200, fmt = (x) => nf(x) } = {}) {
  // rows: [{label, values:{k:v}}], keys: [{k, name, c}] stacked
  if (!rows.length) return `<p class="empty">No data yet.</p>`;
  const W = 640, H = h, L = 46, B = 34, T = 8, bw = Math.max(6, Math.min(46, (W - L - 10) / rows.length - 6));
  const tot = rows.map((r) => sum(keys.map((k) => r.values[k.k] || 0))); const yMax = Math.max(1e-9, ...tot);
  const Y = (y) => T + (H - T - B) * (1 - y / yMax);
  let g = "";
  for (let i = 0; i <= 4; i++) { const y = yMax * i / 4; g += `<line x1="${L}" x2="${W - 6}" y1="${Y(y)}" y2="${Y(y)}" stroke="var(--line)"/><text x="${L - 6}" y="${Y(y) + 3}" text-anchor="end">${esc(fmt(y))}</text>`; }
  rows.forEach((r, i) => {
    const x = L + 6 + i * ((W - L - 10) / rows.length); let acc = 0;
    for (const k of keys) { const v = r.values[k.k] || 0; if (!v) continue;
      g += `<rect x="${x}" y="${Y(acc + v)}" width="${bw}" height="${Y(acc) - Y(acc + v)}" fill="${k.c}" rx="2" data-tip="${esc(r.label)} · ${esc(k.name)}: ${esc(fmt(v))}"/>`; acc += v; }
    g += `<text x="${x + bw / 2}" y="${H - 18}" text-anchor="middle">${esc(r.short || r.label).slice(0, 10)}</text>`;
  });
  return `<div class="svgc"><svg viewBox="0 0 ${W} ${H}">${g}</svg></div><div class="legend">${keys.map((k) => `<span style="--c:${k.c}">${esc(k.name)}</span>`).join("")}</div>`;
}

// ---------- sections ----------
const TABS = [["overview", "Overview"], ["videos", "Videos"], ["money", "Costs & revenue"], ["resources", "Credits & limits"], ["learning", "Learnings"], ["data", "About the data"]];
let TAB = "overview";
$("#tabs").innerHTML = TABS.map(([k, t]) => `<button data-t="${k}">${t}</button>`).join("");
$("#tabs").onclick = (e) => { const b = e.target.closest("button"); if (b) { TAB = b.dataset.t; render(); } };

function attention() {
  const out = [];
  for (const [k, v] of Object.entries(D.resources || {})) {
    if (!["Critical", "Expired", "Running low"].includes(v.status)) continue;
    const bits = [];
    if (v.left !== undefined && v.limit) bits.push(`${nf(v.left)} of ${nf(v.limit)} ${v.unit || ""} left`);
    if (v.videos_left !== undefined) bits.push(`≈${v.videos_left} videos`);
    if (v.days_left !== null && v.days_left !== undefined) bits.push(`≈${v.days_left} days`);
    if (v.renews) bits.push(`renews ${v.renews}`);
    out.push({ s: v.status, html: `${st(v.status)} <b>${esc(k.replace("sub:", ""))}</b> — ${esc(bits.join(", "))} ${v.link ? `<a href="${esc(v.link)}" target="_blank" rel="noopener">open billing ↗</a>` : ""}` });
  }
  const order = { Expired: 0, Critical: 1, "Running low": 2 };
  return out.sort((a, b) => order[a.s] - order[b.s]);
}

function overview() {
  const V = vids();
  const yt = sum(V.map(ytViews)), ig = sum(V.map(igViews));
  const cost = sum(V.map((v) => v.cost.full)), rev = sum(V.map((v) => v.revenue || 0));
  const hasRev = V.some((v) => v.revenue !== null);
  const R = D.resources || {};
  const subs = R.youtube?.subscribers, fol = R.instagram?.followers;
  const att = attention();
  const best = [...V].sort((a, b) => b.views_total - a.views_total);
  const ytDaily = (D.daily || []).filter((d) => Date.parse(d.day) >= since());
  const igDaily = (D.ig_daily || []).filter((d) => Date.parse(d.day) >= since() && d.views !== undefined);
  return `
  ${att.length ? `<div class="card" style="border-color:var(--warn)"><h2>Needs attention</h2><ul class="act">${att.map((a) => `<li>${a.html}</li>`).join("")}</ul></div>` : ""}
  <div class="tiles">
    <div class="tile"><span>Views · YouTube</span><b>${nf(yt)}</b><i>${V.length} videos ${lbl("measured")}</i></div>
    <div class="tile"><span>Views · Instagram</span><b>${nf(ig)}</b><i>Reels ${lbl("measured")}</i></div>
    <div class="tile"><span>Subscribers / followers</span><b>${nf(subs)} / ${nf(fol)}</b><i>now, all time ${lbl("measured")}</i></div>
    <div class="tile"><span>Avg views per video</span><b>${nf(V.length ? (yt + ig) / V.length : null)}</b><i>both platforms</i></div>
    <div class="tile"><span>Spend on these videos</span><b>${usd(cost)}</b><i>incl. shared costs ${lbl("allocated")}</i></div>
    <div class="tile"><span>Cost per video</span><b>${usd(V.length ? cost / V.length : null)}</b><i>full cost, average</i></div>
    <div class="tile"><span>Revenue</span><b>${hasRev ? usd(rev) : "—"}</b><i>${hasRev ? lbl("manual") : "not monetised yet"}</i></div>
    <div class="tile"><span>Profit / loss</span><b class="${rev - cost >= 0 ? "" : "bad"}">${usd(rev - cost)}</b><i>revenue − full cost</i></div>
  </div>
  <div class="grid2">
    <div class="card"><h2>Views by video</h2><p class="note">YouTube (live count) and Instagram for each video in the period. Hover for numbers.</p>
      ${barChart(V.map((v) => ({ label: v.title, short: day(v.published).slice(5), values: { yt: ytViews(v) || 0, ig: igViews(v) || 0 } })),
        [{ k: "yt", name: "YouTube", c: "var(--yt)" }, { k: "ig", name: "Instagram", c: "var(--ig)" }])}</div>
    <div class="card"><h2>Daily views (channel)</h2><p class="note">YouTube Analytics (lags 1–2 days) and Instagram account views per day.</p>
      ${lineChart([{ name: "YouTube", c: "var(--yt)", pts: ytDaily.map((d) => ({ x: Date.parse(d.day), y: d.views || 0, t: d.day })) },
                   { name: "Instagram", c: "var(--ig)", pts: igDaily.map((d) => ({ x: Date.parse(d.day), y: d.views || 0, t: d.day })) }],
        { xs: ytDaily.filter((_, i, a) => i % Math.ceil(a.length / 6 || 1) === 0).map((d) => [Date.parse(d.day), d.day.slice(5)]) })}</div>
  </div>
  <div class="grid2">
    <div class="card"><h2>Best in period</h2>${table(best.slice(0, 5), true)}</div>
    <div class="card"><h2>Weakest in period</h2>${table(best.slice(-5).reverse(), true)}</div>
  </div>`;
}

const COLS = [
  ["title", "Video", (v) => `${esc(v.title)}${v.news ? ' <span class="lbl l-allocated" data-tip="News tie-in">news</span>' : ""}`, "wrap"],
  ["published", "Published", (v) => day(v.published)],
  ["yt", "YT views", (v) => nf(ytViews(v)), "n"],
  ["ig", "IG views", (v) => nf(igViews(v)), "n"],
  ["avp", "YT avg % viewed", (v) => pct(v.yt?.averageViewPercentage), "n"],
  ["igw", "IG avg watch", (v) => v.ig?.ig_reels_avg_watch_time ? nf(v.ig.ig_reels_avg_watch_time / 1000, 1) + " s" : "—", "n"],
  ["eng", "Engagement", (v) => pct(engRate(v), 1), "n"],
  ["cost", "Full cost", (v) => usd(v.cost.full), "n"],
  ["rev", "Revenue", (v) => v.revenue === null ? "—" : usd(v.revenue), "n"],
];
const SORTV = { title: (v) => v.title, published: (v) => v.published, yt: ytViews, ig: igViews, avp: (v) => v.yt?.averageViewPercentage,
  igw: (v) => v.ig?.ig_reels_avg_watch_time, eng: engRate, cost: (v) => v.cost.full, rev: (v) => v.revenue };
function table(V, compact = false) {
  if (!V.length) return `<p class="empty">No videos in this period.</p>`;
  const cols = compact ? COLS.filter((c) => ["title", "yt", "ig", "cost"].includes(c[0])) : COLS;
  return `<div class="scroll"><table><thead><tr>${cols.map(([k, t, , c]) => `<th class="${c || ""}" data-s="${k}">${t}${SORT.k === k ? (SORT.d > 0 ? " ▲" : " ▼") : ""}</th>`).join("")}</tr></thead><tbody>
  ${V.map((v) => `<tr class="click" data-j="${esc(v.job)}">${cols.map(([, , f, c]) => `<td class="${c || ""}">${f(v)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
}
function videosTab() {
  const V = vids().sort((a, b) => { const x = SORTV[SORT.k](a), y = SORTV[SORT.k](b); return ((x ?? -1e18) > (y ?? -1e18) ? 1 : (x ?? -1e18) < (y ?? -1e18) ? -1 : 0) * SORT.d; });
  const yt = V.filter((v) => ytViews(v) !== null), ig = V.filter((v) => igViews(v) !== null);
  return `<div class="tiles">
    <div class="tile"><span>Videos</span><b>${V.length}</b></div>

    ${both("Saves", undefined, v.ig?.saved ?? null)}

    ${both("Avg view duration", v.yt?.averageViewDuration ?? null, v.ig?.ig_reels_avg_watch_time != null ? v.ig.ig_reels_avg_watch_time / 1000 : null, (x) => x == null ? "—" : nf(x) + " s", (x) => x == null ? "—" : nf(x, 1) + " s")}

function resourcesTab() {
  const R = D.resources || {};
  const NAMES = { elevenlabs: "ElevenLabs (voice)", bfl: "Black Forest Labs (images)", anthropic: "Anthropic API (writing, review)", github: "GitHub Actions (automation)", instagram: "Instagram", youtube: "YouTube" };
  const cards = Object.entries(R).map(([k, v]) => {
    const pctLeft = (v.left !== undefined && v.limit) ? Math.max(0, Math.min(100, 100 * v.left / v.limit)) : null;
    const kv = [];
    const add = (a, b, l) => { if (b !== undefined && b !== null && b !== "") kv.push(`<dt>${a}</dt><dd>${b}${l ? lbl(l) : ""}</dd>`); };
    if (k === "elevenlabs") { add("Credits left", `${nf(v.left)} / ${nf(v.limit)}`, "measured"); add("Plan", `${esc(v.tier)} · ${esc(v.plan_status)}`); add("Resets", v.resets); add("Next bill", v.next_invoice != null ? `${esc(v.currency)} ${nf(v.next_invoice, 2)} on ${esc(v.renews || "—")}` : null); add("Per video", v.per_video ? nf(v.per_video) + " credits" : null, "measured"); }
    else if (k === "bfl") { add("Credits left", `${nf(v.left)} (${usd(v.usd_left)})`, "measured"); add("Per video", v.per_video_usd ? usd(v.per_video_usd) : null, "estimated"); }
    else if (k === "anthropic") { add("Spent this month", usd(v.spent_month_calc), "calculated"); add("Billed this month", v.billed_month != null ? usd(v.billed_month) : null, "measured");
      add("Balance left", v.left_usd != null ? usd(v.left_usd) : "unknown", v.left_usd != null ? "allocated" : "unavailable"); add("Per video", v.per_video_usd ? usd(v.per_video_usd) : null, "calculated"); }
    else if (k === "github") { add("Minutes used", `${nf(v.used)} / ${nf(v.limit)}`, "measured"); add("Per day (7-day avg)", v.per_day ? nf(v.per_day) : null); add("Runs out", v.runs_out); add("Resets", v.resets); add("Allowance", v.limit_source); }
    else if (k === "instagram") { add("Posts used (24 h)", `${nf(v.used)} / ${nf(v.limit)}`, "measured"); add("Login expires", v.login_expires); add("Followers", nf(v.followers)); }
    else if (k === "youtube") { add("Login", v.login); add("Subscribers", nf(v.subscribers)); add("API quota", "not reported", "unavailable"); }
    else if (k.startsWith("sub:")) { add("$/month", usd(v.usd_month), "manual"); add("Renews", v.renews); add("Days left", v.days_left); add("Updated", day(v.updated)); }
    add("Videos left", v.videos_left !== undefined ? nf(v.videos_left) : null, "allocated"); add("≈ Days left", v.days_left !== undefined && !k.startsWith("sub:") ? v.days_left : null);
    return `<div class="card"><div style="display:flex;justify-content:space-between;align-items:center;gap:8px"><h2>${esc(NAMES[k] || k.replace("sub:", "Subscription: "))}</h2>${st(v.status || "Unknown")}</div>
      ${pctLeft !== null ? `<div class="meter"><div style="width:${pctLeft}%;background:${v.status === "Healthy" ? "var(--good)" : v.status === "Running low" ? "var(--warn)" : "var(--bad)"}"></div></div>` : ""}
      ${v.source === "unavailable" ? `<p class="note">${esc(v.why || "")}</p>` : ""}
      <dl class="kv">${kv.join("")}</dl>${v.note || v.left_note || v.quota_note ? `<p class="note">${esc(v.left_note || v.note || v.quota_note)}</p>` : ""}
      ${v.link ? `<a href="${esc(v.link)}" target="_blank" rel="noopener">Billing / top-up ↗</a>` : ""}</div>`;
  }).join("");
  const att = attention();
  const M = D.manual || {};
  return `<p class="note">Checked ${esc(D.resources_at || "—")}. Status: <b>Healthy</b> · <b>Running low</b> (&lt;25% or &lt;7 days) · <b>Critical</b> (&lt;10% or &lt;3 days) · <b>Expired</b>. Problems are also sent to Telegram once a day.</p>
  ${att.length ? `<div class="card" style="border-color:var(--warn)"><h2>Do this first</h2><ol class="act">${att.map((a) => `<li>${a.html}</li>`).join("")}</ol></div>` : `<div class="card"><h2>Nothing needs attention</h2></div>`}
  <div class="res">${cards || '<p class="empty">No checks yet — the first runs at the next refresh.</p>'}</div>
  <div class="card" style="margin-top:14px"><h2>Values only you can enter</h2><p class="note">Services with no balance API. The dashboard subtracts our measured use since the date you save ${lbl("allocated")}.</p>
   <form class="inline" id="fbal"><label>Anthropic Console balance (USD)<input name="usd" type="number" step="0.01" required></label><button class="btn primary">Save</button>
    <span class="muted">${M.balances?.anthropic ? `Last: ${usd(M.balances.anthropic.usd)} on ${day(M.balances.anthropic.at)}` : ""}</span></form>
   <form class="inline" id="flim"><label>GitHub Actions minutes / month<input name="github_minutes" type="number" value="${esc(M.limits?.github?.github_minutes || "")}" placeholder="2000 (Free plan)"></label>
    <label>Planned videos / day<input name="videos_per_day" type="number" step="0.5" value="${esc(M.plan?.production?.videos_per_day || "")}" placeholder="1"></label><button class="btn primary">Save</button></form></div>`;
}

function mdToHtml(md) {
  return esc(md).replace(/^### (.*)$/gm, "<h3>$1</h3>").replace(/^## (.*)$/gm, "<h3>$1</h3>").replace(/^# (.*)$/gm, "<h2>$1</h2>")

}

  </div>
  <div class="card"><h2>Video reviews (48 hours and 7 days after publishing)</h2>${withRev.length ? `<div class="scroll"><table><thead><tr><th>Video</th><th>Review</th><th>Verdict</th><th>Summary</th></tr></thead><tbody>
   ${withRev.flatMap((v) => Object.entries(v.reviews).map(([t, r]) => `<tr class="click" data-j="${esc(v.job)}"><td class="wrap">${esc(v.title)}</td><td>${esc(t)}</td><td>${esc(r.verdict || "")}</td><td class="wrap">${esc((r.summary || "").slice(0, 260))}</td></tr>`)).join("")}</tbody></table></div>` : '<p class="empty">No reviews in this period yet.</p>'}</div>
  <div class="card"><h2>Weekly learning report</h2><pre>${mdToHtml(D.learnings_md || "Not yet generated.")}</pre></div>
  <div class="card"><h2>Experiments</h2>${(D.experiments || []).map((e) => `<p><b>${esc(e.id)}</b> · ${esc(e.status)} — ${esc(e.hypothesis || "")}</p>`).join("") || '<p class="empty">None.</p>'}</div>`;
}

function dataTab() {
  const U = [
    ["YouTube views, likes, comments", "measured", "YouTube Data API, every refresh (minutes old)."],
    ["YouTube watch time, retention, shares, subscribers, traffic sources", "measured", "YouTube Analytics API; appears 1–2 days after publishing."],
    ["YouTube impressions & click-through rate", "unavailable", "Not offered by the YouTube APIs; see YouTube Studio → Analytics → Reach."],
    ["YouTube revenue", "unavailable", "API access needs the YouTube Partner Program. Until then, enter payouts by hand."],
    ["Instagram views, reach, likes, comments, shares, saves, watch time, skip rate", "measured", "Instagram API; can lag up to 48 hours."],
    ["Instagram follows / profile visits per Reel", "unavailable", "Meta returns these only for feed posts and stories, not Reels."],
    ["Instagram account reach, views, link taps per day", "measured", "Instagram API, once a day."],
    ["Instagram revenue", "unavailable", "No API for this account type; enter by hand."],
    ["Anthropic cost", "calculated", "Exact tokens reported by the API × list prices. Billed cost needs an Admin API key (organisations only)."],
    ["Anthropic balance", "unavailable", "No balance API: enter your Console balance; we subtract measured use since."],
    ["ElevenLabs characters & credits left, plan, next bill", "measured", "ElevenLabs subscription API; per-video cost = characters × (plan price ÷ plan credits)."],
    ["Image cost (BFL)", "estimated", "List price per image unless BFL reports the cost; credits balance is measured."],
    ["GitHub Actions minutes", "measured", "Per-run billable time from GitHub's API; Free plan allows 2,000 minutes/month for private repos."],
    ["Claude subscription", "manual", "No API; enter price, renewal date and the share used for this channel."],
    ["Meta, Google Cloud, YouTube API, Cloudflare, Telegram", "measured", "Free plans: $0. Usage limits shown where an API reports them."],
  ];
  return `<div class="card"><h2>Where every number comes from</h2><table><tbody>${U.map(([a, l, b]) => `<tr><td class="wrap">${esc(a)}</td><td>${lbl(l)}</td><td class="wrap muted">${esc(b)}</td></tr>`).join("")}</tbody></table></div>
  <div class="card"><h2>Refresh</h2><p>Every ${D.refresh.every_hours} hours automatically, or press <b>Refresh now</b> (takes ~3 minutes, then reload). ${esc(D.refresh.note)}</p>
   <p class="muted">Page built ${esc(D.generated_at)} · YouTube Analytics last pulled ${esc(D.metrics_at || "—")}.</p>
   <p class="muted">Why not more often? GitHub's free plan has 2,000 automation minutes a month, and most platform numbers only update a few times a day.</p></div>
  <div class="card"><h2>Label key</h2>${Object.keys(LBL).map((k) => `<p>${lbl(k)} ${esc(LBL[k])}</p>`).join("")}</div>
  <div class="card"><h2>Recent warnings</h2><div class="scroll"><table><tbody>${(D.events || []).slice(0, 20).map((e) => `<tr><td>${day(e.at)}</td><td>${esc(e.level)}</td><td class="wrap">${esc(e.msg)}</td></tr>`).join("") || '<tr><td class="empty">None.</td></tr>'}</tbody></table></div></div>`;
}

// ---------- render + events ----------
function render() {
  $("#fresh").textContent = `Updated ${new Date(D.generated_at).toLocaleString()}`;
  [...$("#tabs").children].forEach((b) => b.classList.toggle("on", b.dataset.t === TAB));
  document.querySelectorAll("main section").forEach((s) => s.classList.toggle("on", s.id === TAB));
  const f = { overview, videos: videosTab, money: moneyTab, resources: resourcesTab, learning: learningTab, data: dataTab }[TAB];
  $("#" + TAB).innerHTML = f();
  $("#filters").style.display = ["resources", "data"].includes(TAB) ? "none" : "flex";
  wrapTables($("#" + TAB));
}
function wrapTables(root) {   // every table scrolls sideways on its own; the page never does
  root.querySelectorAll("table").forEach((t) => { if (t.closest(".scroll")) return;
    const w = document.createElement("div"); w.className = "scroll"; t.parentNode.insertBefore(w, t); w.appendChild(t); });
}
document.addEventListener("click", async (e) => {
  const th = e.target.closest("th[data-s]");
  if (th) { const k = th.dataset.s; SORT = { k, d: SORT.k === k ? -SORT.d : -1 }; render(); return; }
  const tr = e.target.closest("tr[data-j]");
  if (tr) { const v = D.videos.find((x) => x.job === tr.dataset.j); if (v) { $("#dlgt").textContent = v.title; $("#dlgb").innerHTML = videoDetail(v); wrapTables($("#dlgb")); $("#dlg").showModal(); } return; }
  const ds = e.target.closest("[data-del-sub]"); if (ds) return save({ op: "set", section: "subscriptions", name: ds.dataset.delSub, value: null });
  const dr = e.target.closest("[data-del-rev]"); if (dr) return save({ op: "revenue_del", index: Number(dr.dataset.delRev) });
  const dc = e.target.closest("[data-del-chg]"); if (dc) return save({ op: "charge_del", index: Number(dc.dataset.delChg) });
});
async function save(body) {
  try {
    const r = await fetch("/dash/manual", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(body), credentials: "same-origin" });
    if (!r.ok) throw new Error(await r.text());
    D.manual = await r.json(); render(); toast("Saved. Calculations update at the next refresh.");
  } catch (err) { toast("Couldn't save: " + err.message); }
}
function toast(t) { tip.textContent = t; tip.style.display = "block"; tip.style.left = "16px"; tip.style.top = "70px"; setTimeout(() => tip.style.display = "none", 3500); }
const num = (x) => x === "" || x === null || x === undefined ? undefined : Number(x);
document.addEventListener("submit", (e) => {
  const f = e.target; e.preventDefault(); const d = Object.fromEntries(new FormData(f));
  if (f.id === "fsub") save({ op: "set", section: "subscriptions", name: d.name, value: { plan: d.plan, usd_month: num(d.usd_month), share_pct: num(d.share_pct), renews: d.renews } });
  if (f.id === "frev") save({ op: "revenue_add", rows: [{ period: d.period, platform: d.platform, job: d.job, usd: num(d.usd), note: d.note }] });
  if (f.id === "fchg") save({ op: "charge_add", rows: [{ month: d.month, service: d.service, usd: num(d.usd), note: d.note }] });
  if (f.id === "fbal") save({ op: "set", section: "balances", name: "anthropic", value: { usd: num(d.usd) } });
  if (f.id === "flim") { if (d.github_minutes) save({ op: "set", section: "limits", name: "github", value: { github_minutes: num(d.github_minutes) } });
    if (d.videos_per_day) save({ op: "set", section: "plan", name: "production", value: { videos_per_day: num(d.videos_per_day) } }); }
});
document.addEventListener("change", async (e) => {
  if (e.target.id !== "revcsv" || !e.target.files[0]) return;
  const lines = (await e.target.files[0].text()).trim().split(/\r?\n/); const head = lines.shift().split(",").map((x) => x.trim().toLowerCase());
  const rows = lines.map((l) => { const c = l.split(","); const o = {}; head.forEach((h, i) => o[h] = (c[i] || "").trim()); o.usd = num(o.usd); return o; }).filter((o) => o.period && Number.isFinite(o.usd));
  if (rows.length) save({ op: "revenue_add", rows }); else toast("No valid rows (need period,platform,job,usd,note).");
});
$("#refresh").onclick = async () => {
  try { const r = await fetch("/dash/refresh", { method: "POST", credentials: "same-origin" }); const j = await r.json();
    toast(j.ok ? "Refreshing — reload in about 3 minutes." : (j.why || "Couldn't start a refresh.")); } catch { toast("Couldn't start a refresh."); }
};
// live manual values (entered since the last build)
fetch("/dash/manual.json", { credentials: "same-origin" }).then((r) => r.ok ? r.json() : null).then((m) => { if (m) { D.manual = m; render(); } }).catch(() => {});
render();
</script>
</body>
