cloudflare_account_id: a741d1d4877261452def869b39c7e4bc

schedule:
  timezone: Asia/Kolkata
  produce_per_day: 1
  publish_slots_utc: ["13:30"]   # fallback only; the active experiment in config/experiments.yaml decides
  analytics_every_hours: 6

approval:
  # auto (owner, 28 Oct 2026): a video that passes the final review (Pipeline.critique, onigiri-level bar) is
  # uploaded private + scheduled for its slot without waiting for the owner; he gets a message with a
  # "Stop it" button. After auto_until the system goes back to manual approval by itself.
  mode: auto
  auto_until: "2026-11-25"
  privacy_on_upload: private

providers:
  llm:
    vendor: anthropic
    model_script: claude-sonnet-5-5
    model_routine: claude-haiku-5-5
    web_search_tool: web_search_20250305   # basic search; the newer version's code-execution filtering used up output tokens
    max_searches_per_video: 6
    # USD per million tokens (input, output) - update when prices change
    prices: {claude-sonnet-5-5: [2.0, 10.0], claude-haiku-5-5: [0.10, 0.50]}
    web_search_usd_each: 0.01
  tts:
    vendor: elevenlabs
    usd_per_1k_chars: 0.18     # measured 2026-10-24: ~337 credits ≈ $0.061 for 331 chars
  images:
    vendor: bfl
    model: flux-2-pro           # 28 Oct 2026: klein drew malformed objects (safety-pin test); pro + a strict
    fallback_model: flux-2-klein-4b  # credibility check per picture. Fallback is only for API errors.
    usd_each: {flux-2-klein-4b: 0.015, flux-2-pro: 0.03}
    width: 1088                 # multiples of 16, near 9:16
    height: 1920
  video_clips:
    enabled: false              # OFF: stills format (onigiri v9) is the default since 28 Oct 2026 (owner: cheaper format
                                # that already worked). Clips cost ~$2.50-3.50 more per video; test only as an experiment.
    vendor: bfl
    model: flux-3-video         # image-to-video from our checked still
    draft: true                 # draft render: $0.06/s (full render $0.17/s)
    usd_per_second: {draft: 0.06, full: 0.17}
    max_clips: 8                # per video, including replacements
    max_seconds: 40             # per video (~$2.40 at draft rate)
    max_regenerations: 2        # clips redone after a failed quality check

retries:
  max_attempts: 3
  backoff_seconds: [5, 30, 120]

paths:
  state_db: state/live.db
  build_dir: build
